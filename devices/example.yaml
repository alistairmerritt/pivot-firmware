# ============================================================
# Pivot — per-device configuration
# ============================================================
#
# This is the ONLY file you need per device. Fill in the
# substitutions below, then click Install in ESPHome —
# the full firmware is pulled from GitHub automatically.
#
# UPDATES: when a new Pivot firmware version is released,
# just open the device in ESPHome and click Install. Done.
# ============================================================

substitutions:
  # =======================================================================
  # PIVOT DEVICE CONFIGURATION — fill in these values for each device
  # =======================================================================

  # ESPHome device name (slug, no spaces — use dashes not underscores)
  device_name: home-assistant-voice-lounge

  # Friendly name shown in HA and ESPHome
  device_friendly_name: Lounge VPE

  # Pivot device suffix — unique per device, no spaces or dashes
  # Must match exactly what you enter in the Pivot integration
  device_suffix: ha_voice_lounge

  # WiFi credentials — add these lines to your ESPHome secrets.yaml:
  #   wifi_ssid: "Your Network Name"
  #   wifi_password: "Your Password"
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password

  # API encryption key — generate a unique one per device at:
  # https://esphome.io/components/api.html#configuration-variables
  api_encryption_key: "generate-a-unique-key-here"

  # OTA update password — REQUIRED, and unique per device.
  # Without this anyone who can reach the device on your network can replace
  # its firmware. Generate one with:  openssl rand -hex 16
  # Then add it to your ESPHome secrets.yaml, e.g.:
  #   pivot_ota_lounge: "a1b2c3..."
  # Keep a copy — losing it means recovery requires a USB flash.
  ota_password: !secret pivot_ota_lounge

  # LED orientation — set based on how your device is mounted:
  #   '6'  flat on a surface, cable facing away (LEDs start at bottom)
  #   '0'  upright on a stand, cable at the bottom (LEDs start at top)
  led_offset: '6'

  # =======================================================================

packages:
  pivot:
    url: https://github.com/alistairmerritt/pivot-firmware
    ref: main
    file: home-assistant-voice.yaml
    refresh: 0s
